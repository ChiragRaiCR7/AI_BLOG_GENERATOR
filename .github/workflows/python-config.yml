name: "Python Security Configuration"

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality
  - name: custom-python-checks
    uses: ./codeql-queries

paths:
  - "agents/"
  - "utils/"
  - "*.py"

paths-ignore:
  - "**/tests/"
  - "**/__pycache__/"
  - "venv/"
